<!DOCTYPE html>
<html>
<head>
    <title>Academic Success Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Student Success Predictor</h1>
        <form id="predictionForm">
            <label>Course ID:</label>
            <input type="number" name="Course" required>
            
            <label>Previous Qualification (Grade):</label>
            <input type="number" step="0.1" name="Previous_qualification_grade" required>

            <label>GDP:</label>
            <input type="number" step="0.01" name="GDP" required>

            <button type="submit">Predict Status</button>
        </form>

        <div id="result">
            <h3>Prediction: <span id="predictionValue">---</span></h3>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
