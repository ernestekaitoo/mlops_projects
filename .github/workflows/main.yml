name: End-to-End MLOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the code from GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Run Training (Generates models and transformers)
    # This ensures your code actually runs and saves the .joblib files
    - name: Train Model
      run: |
        python src/train.py

    # 5. Build Docker Image
    # This verifies the Dockerfile is correct and all files (params, models) exist
    - name: Build Docker Image
      run: |
        docker build -t academic-success-predictor .

    # 6. Verify Container Starts
    # This runs a quick test to see if the API can boot up
    - name: Test Docker Container
      run: |
        docker run -d -p 8000:8000 --name test-container academic-success-predictor
        sleep 5
        docker ps | grep test-container
        docker stop test-container
