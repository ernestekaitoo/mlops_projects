# Data Configuration
data:
  test_size: 0.2
  random_state: 9
  target_column: "Target"

# Hyperparameter Tuning Configuration
tuning:
  random_forest:
    n_estimators: [500]
    max_depth: [10, null]
    min_samples_split: [10]
    min_samples_leaf: [1]
    max_features: ["sqrt"]
  
  gradient_boosting:
    n_estimators: [400]
    learning_rate: [0.1]
    max_depth: [4]
    min_samples_split: [2]
    min_samples_leaf: [1]
    max_features: ["sqrt"]